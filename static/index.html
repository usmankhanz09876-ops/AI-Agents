<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
    header { background: #1a73e8; color: white; padding: 20px 32px; font-size: 1.4rem; font-weight: 600; }
    .container { max-width: 860px; margin: 32px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 14px; color: #555; text-transform: uppercase; letter-spacing: .5px; }
    textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 0.95rem; resize: vertical; min-height: 80px; outline: none; }
    textarea:focus { border-color: #1a73e8; }
    button { margin-top: 10px; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-primary:hover { background: #1558b0; }
    .btn-success { background: #34a853; color: white; }
    .btn-success:hover { background: #2a8a43; }
    .result { margin-top: 14px; padding: 14px; background: #f8f9fa; border-radius: 8px; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { background: #f1f3f4; text-align: left; padding: 10px 12px; color: #666; font-weight: 600; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .income { background: #e6f4ea; color: #2a8a43; }
    .expense { background: #fce8e6; color: #c5221f; }
    .loading { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <header>💰 Budget Tracker</header>
  <div class="container">

    <div class="card">
      <h2>Add Entry</h2>
      <textarea id="entryInput" placeholder="e.g. spent $200 on groceries and earned $3000 salary"></textarea>
      <button class="btn-primary" onclick="addEntry()">Add Entry</button>
      <div class="result" id="entryResult"></div>
    </div>

    <div class="card">
      <h2>AI Advisor</h2>
      <button class="btn-success" onclick="analyze()">Analyze My Budget</button>
      <div class="result" id="adviceResult"></div>
    </div>

    <div class="card">
      <h2>All Entries</h2>
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Description</th></tr></thead>
        <tbody id="entriesTable"><tr><td colspan="5" class="loading">Loading...</td></tr></tbody>
      </table>
    </div>

  </div>

  <script>
    async function addEntry() {
      const text = document.getElementById("entryInput").value.trim();
      if (!text) return;
      const result = document.getElementById("entryResult");
      result.style.display = "block";
      result.textContent = "Processing...";
      const res = await fetch("/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (!res.ok) { result.textContent = "Error: " + data.detail; return; }
      result.textContent = data.entries.map(e =>
        `[${e.type.toUpperCase()}] ${e.category}: $${e.amount} — ${e.description}`
      ).join("\n");
      document.getElementById("entryInput").value = "";
      loadEntries();
    }

    async function analyze() {
      const result = document.getElementById("adviceResult");
      result.style.display = "block";
      result.textContent = "Analyzing...";
      const res = await fetch("/analyze");
      const data = await res.json();
      if (!res.ok) { result.textContent = "Error: " + data.detail; return; }
      result.textContent = data.advice;
    }

    async function loadEntries() {
      const res = await fetch("/entries");
      const data = await res.json();
      const tbody = document.getElementById("entriesTable");
      if (!data.entries.length) {
        tbody.innerHTML = '<tr><td colspan="5">No entries yet.</td></tr>';
        return;
      }
      tbody.innerHTML = data.entries.reverse().map(e => `
        <tr>
          <td>${e.date}</td>
          <td><span class="badge ${e.type}">${e.type}</span></td>
          <td>${e.category}</td>
          <td>$${e.amount}</td>
          <td>${e.description}</td>
        </tr>`).join("");
    }

    loadEntries();
  </script>
</body>
</html>
